name: Validate upstream sync

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: upstream-sync-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.repository == 'jacobmichels/home-manager' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'automation/upstream-sync'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Test Fish behavior and build module docs
        run: >-
          nix build --no-link --show-trace
          .#test-fish-suppress-greeting .#test-fish-functions .#docs-jsonModuleMaintainers
